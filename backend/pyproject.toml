[project]
name = "pumptime-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "sqlalchemy",
    "pytesseract",
    "uvicorn",
    "python-multipart",
    "pillow",
    "opencv-python"
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]